# ── Colores correctos para temas nvim (truecolor) ──
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# ── Escape sin delay (clave para nvim) ──
set -sg escape-time 10
set -g focus-events on

# ── Calidad de vida ──
set -g mouse on
set -g history-limit 50000
set -g base-index 1          # ventanas desde 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# ── Splits intuitivos (| horizontal, - vertical) en el dir actual ──
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Nav de panes estilo vim (prefix + h/j/k/l) ──
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Resize panes (prefix + H/J/K/L, repetible) ──
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Reload rapido: prefix + r ──
bind r source-file ~/.tmux.conf \; display "tmux config recargada"

# ── Barra de estado minima ──
set -g status-style "bg=default fg=white"
set -g status-left "#[bold]#S "
set -g status-right "%H:%M "
set -g status-left-length 30
